<!--
  AF STUDIO — шаблон письма «Confirm signup» для Supabase (необязательно, но рекомендуется).
  Supabase → Authentication → Emails → Confirm signup → вставить этот файл.
  Ссылка с token_hash подтверждает email в любом браузере (не только в том, где была регистрация).
-->
<div style="background:#0b0a09;padding:32px 12px">
  <div style="font-family:Inter,Arial,sans-serif;max-width:560px;margin:auto;padding:32px;background:#16130f;color:#f6f2ec;border-radius:20px;border:1px solid #2b251f">
    <div style="font:700 28px Arial;letter-spacing:-.02em;color:#e8c4a0">AF <span style="font:600 11px Arial;letter-spacing:.3em;color:#8a837c">STUDIO</span></div>
    <h2 style="font-weight:600;margin:24px 0 10px">Подтвердите email</h2>
    <p style="color:#cfc7bd;line-height:1.55;margin:0 0 22px">Остался один шаг — подтвердите адрес, чтобы войти в AF STUDIO.</p>
    <p style="margin:0 0 26px"><a href="{{ .SiteURL }}/index.html?token_hash={{ .TokenHash }}&type=email"
      style="background:linear-gradient(120deg,#f3d9b8,#d4a574);color:#1c1917;padding:13px 24px;border-radius:999px;text-decoration:none;font-weight:700">Подтвердить email</a></p>
    <p style="color:#8a837c;font-size:12px;margin:0">Если вы не регистрировались — просто проигнорируйте письмо.</p>
  </div>
</div>
