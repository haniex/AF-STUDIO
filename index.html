<body class="dark af-booting">
  <!-- AF boot screen: shown while the session is verified on the server. Nothing else is rendered. -->
  <div id="af-boot" class="af-boot" role="status" aria-live="polite">
    <div class="af-boot__core">
      <div class="af-boot__ring" aria-hidden="true"><span></span><span></span></div>
      <div class="af-boot__logo">AF</div>
      <p class="af-boot__text" id="af-boot-text">Проверяем доступ…</p>
      <p class="af-boot__secure"><span></span><b data-i18n="boot.secure">Защищённое соединение</b></p>
    </div>
  </div>

  <div id="af-auth" hidden></div>
  <div id="af-app" hidden></div>

  <noscript>
    <div class="af-noscript">AF STUDIO требует JavaScript. / AF STUDIO requires JavaScript.</div>
  </noscript>
</body>
